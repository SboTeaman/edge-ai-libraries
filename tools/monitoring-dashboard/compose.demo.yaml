# =============================================================================
# Intel XPU Monitoring Dashboard — DEMO (synthetic metrics, no hardware)
# =============================================================================
# Runs a synthetic exporter emitting the same metric names as metrics-manager,
# so the dashboards render with animated data on any machine — no Intel GPU/NPU,
# no metrics-manager required. For demos, screenshots and dashboard validation.
#
#   mock-exporter (:9273)  ──►  Prometheus  ──►  Grafana (:3000)
#
# Usage:
#   docker compose -f compose.demo.yaml up -d
#   open http://localhost:3000   (admin / admin)
#
# Simulate different hardware by setting DEMO_PROFILE (default cpu+gpu+npu):
#   DEMO_PROFILE=cpu          docker compose -f compose.demo.yaml up -d
#   DEMO_PROFILE=cpu+gpu      docker compose -f compose.demo.yaml up -d
#   DEMO_PROFILE=cpu+npu      docker compose -f compose.demo.yaml up -d
#   DEMO_PROFILE=cpu+gpu+npu  docker compose -f compose.demo.yaml up -d
# GPU/NPU panels stay empty when that part is off — just like a real host
# without the hardware.
# =============================================================================

name: xpu-monitoring-demo

services:
  mock-exporter:
    image: python:3.12-slim
    container_name: xpu-mock-exporter
    restart: unless-stopped
    command: ["python", "/app/mock_exporter.py"]
    environment:
      - DEMO_PROFILE=${DEMO_PROFILE:-cpu+gpu+npu}
    volumes:
      - ./demo/mock_exporter.py:/app/mock_exporter.py:ro
    networks:
      - xpu-net

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: xpu-prometheus-demo
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROM_RETENTION_TIME:-1d}"
    volumes:
      - ./prometheus/prometheus.demo.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - xpu-net

  grafana:
    image: grafana/grafana:11.6.1
    container_name: xpu-grafana-demo
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "${HOST_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - xpu-net

networks:
  xpu-net:
    driver: bridge

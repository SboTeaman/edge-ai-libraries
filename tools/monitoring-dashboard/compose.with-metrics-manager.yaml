# =============================================================================
# Intel XPU Monitoring Dashboard — Variant A: with metrics-manager (RECOMMENDED)
# =============================================================================
#
# Brings up the full telemetry stack in one command:
#
#   metrics-manager (:9273 Prometheus exporter)  →  Prometheus  →  Grafana (:3000)
#        GPU + NPU + CPU + custom metrics            1s scrape       dashboards
#
# metrics-manager is the recommended engine: it is the only collector that
# unifies Intel GPU (qmassa), NPU and CPU/system metrics in a single container.
#
# The metrics-manager service itself is NOT redefined here — it is pulled in
# verbatim via `include` from the microservice, so this tool never drifts from
# the upstream service definition.
#
# Usage:
#   cp .env.example .env            # default: admin/admin (change in .env if needed)
#   docker compose -f compose.with-metrics-manager.yaml up -d --build
#   open http://localhost:3000      # Grafana: admin / admin
#
# =============================================================================

# Pull in the metrics-manager service + metric-network verbatim from the
# microservice. Path is relative to this file:
#   tools/monitoring-dashboard -> microservices/metrics-manager
include:
  - path: ../../microservices/metrics-manager/compose.yaml

services:
  # ---------------------------------------------------------------------------
  # Prometheus — scrapes metrics-manager:9273, stores time series
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: xpu-prometheus
    restart: unless-stopped
    # Retention lives here as CLI flags (NOT in prometheus.yml):
    #  - time: drop samples older than the window
    #  - size: soft cap on compacted blocks (WAL/head not counted — leave disk headroom)
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROM_RETENTION_TIME:-7d}"
      - "--storage.tsdb.retention.size=${PROM_RETENTION_SIZE:-2GB}"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.with-mm.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # No host port by default — Grafana reaches Prometheus over metric-network.
    # metrics-manager already binds host:9090; publishing Prometheus on host
    # would collide. Uncomment for debugging on an alternate port:
    # ports:
    #   - "${HOST_PROMETHEUS_PORT:-9091}:9090"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - metric-network

  # ---------------------------------------------------------------------------
  # Grafana — auto-provisioned datasource + dashboards
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.6.1
    container_name: xpu-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED:-false}
      # Proxy passthrough (build/runtime parity with the rest of the repo)
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=localhost,127.0.0.1,prometheus,${NO_PROXY:-}
    ports:
      - "${HOST_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - metric-network

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# metric-network is defined by the included metrics-manager compose; declaring
# it here as external:false would conflict, so we rely on the included
# definition and simply join it from the services above.

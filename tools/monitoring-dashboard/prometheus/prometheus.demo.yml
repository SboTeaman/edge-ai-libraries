# DEMO scrape config — points at the synthetic mock exporter instead of
# metrics-manager. Same metric names, so the dashboards render identically.
global:
  scrape_interval: 1s
  scrape_timeout: 1s
  evaluation_interval: 15s
  external_labels:
    monitor: intel-xpu-demo

scrape_configs:
  - job_name: metrics-manager
    metrics_path: /metrics
    static_configs:
      - targets: ["mock-exporter:9273"]

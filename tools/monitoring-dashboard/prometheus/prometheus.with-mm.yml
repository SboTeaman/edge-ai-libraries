# =============================================================================
# Prometheus scrape config — Variant A (with metrics-manager)
# =============================================================================
# Retention is configured via CLI flags in compose (--storage.tsdb.retention.*),
# NOT here. This file only declares what to scrape and how often.
#
# scrape_interval matches Telegraf's 1s collection so instantaneous gauges
# (gpu_power, npu_*, utilization) are not under-sampled — catching power peaks
# is the primary daily use case.
#
# IMPORTANT: scrape_timeout MUST be <= scrape_interval. Prometheus refuses to
# start if scrape_timeout > scrape_interval. The global default timeout is 10s,
# so with a 1s interval we set the timeout explicitly to 1s.
# =============================================================================

global:
  scrape_interval: 1s
  scrape_timeout: 1s
  evaluation_interval: 15s
  external_labels:
    monitor: intel-xpu

scrape_configs:
  # metrics-manager exposes system + GPU + NPU + custom metrics on one endpoint.
  # Custom metrics pushed via the API are forwarded to Telegraf and also appear
  # here, so a single target covers everything.
  - job_name: metrics-manager
    metrics_path: /metrics
    static_configs:
      - targets: ["metrics-manager:9273"]

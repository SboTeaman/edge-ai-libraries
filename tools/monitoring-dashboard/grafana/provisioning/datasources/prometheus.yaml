# Auto-provisioned Prometheus datasource.
# Fixed uid ("prometheus") so dashboards can reference it deterministically
# without any manual import step.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    # Reached over metric-network by service name (container port 9090).
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "1s"
